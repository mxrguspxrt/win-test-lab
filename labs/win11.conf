# AD lab "win11": Windows Server 2019 domain controller + a Windows 11 Pro client.
#   use it from a run config:  version = win11   (or layer it:  lab run myapp.conf win11.conf)
#
# A Windows client cannot be a domain controller, so the DC is a Windows Server; only the
# student machine (the one your program runs on) is Windows 11.
#
# NOTE: this host has no swtpm, so Windows 11 is installed with the Setup TPM/Secure-Boot
# bypass (it boots UEFI via OVMF, but without a real TPM). Fine for testing software; it is
# not a faithful "secured-core" Windows 11.

LAB_OS=2019              # the domain controller OS (must be a Windows Server)
LAB_CLIENT_OS=win11      # the student machine OS

LAB_DOMAIN=lab.local
LAB_NETBIOS=LAB
LAB_DC_NAME=DC11
LAB_CLIENT_NAME=CL11

LAB_NET=10.77.111
LAB_PREFIX=24
LAB_LAN_PORT=47111

LAB_ADMIN_USER=labadmin
LAB_ADMIN_USER_PASSWORD='DomAdm!2026'
LAB_USER=student
LAB_USER_PASSWORD='Pupil!2026'

LAB_DC_MEM=3072
LAB_CLIENT_MEM=4096
