# AD lab "2012": Windows Server 2012 R2 domain controller + a Windows Server 2012 R2 client.
#   point a run config at this lab with  version = 2012  (see ./lab.sh --help, docs/CONFIG.md)
# For another Windows version copy this file (e.g. labs/2019.conf) and change LAB_OS /
# LAB_CLIENT_OS, the computer names, LAB_NET and LAB_LAN_PORT.

LAB_OS=2012              # DC operating system (key from lib/oslist.conf)
LAB_CLIENT_OS=2012       # client operating system

LAB_DOMAIN=lab.local     # new AD forest
LAB_NETBIOS=LAB          # users log on as LAB\student
LAB_DC_NAME=DC2012       # computer names (max 15 chars)
LAB_CLIENT_NAME=CL2012

# private VM-to-VM network (no DHCP; the DC is the DNS server). Only the client also gets
# user-mode NAT (internet + port forwards to the host); the DC is isolated.
LAB_NET=10.77.12         # DC = .10, client = .20
LAB_PREFIX=24
LAB_LAN_PORT=47012       # host loopback TCP port that carries the lab LAN between the two QEMUs

# Domain Administrator = the image's Administrator (password WTL_PASSWORD, default WinTest!2026)
# (Windows rejects a password that contains the account name)
LAB_ADMIN_USER=labadmin              # extra Domain Admins account
LAB_ADMIN_USER_PASSWORD='DomAdm!2026'
LAB_USER=student                     # domain user the client logs on as automatically
LAB_USER_PASSWORD='Pupil!2026'

LAB_DC_MEM=3072          # MB
LAB_CLIENT_MEM=4096
