# AD lab "win10": Windows Server 2019 domain controller + a Windows 10 Pro client.
#   use it from a run config:  version = win10   (or layer it:  lab run myapp.conf win10.conf)
#
# A Windows client cannot be a domain controller, so the DC is a Windows Server; only the
# student machine (the one your program runs on) is Windows 10. Windows 10 is BIOS/MBR here
# (no UEFI/TPM requirement), same as the Server labs.

LAB_OS=2019              # the domain controller OS (must be a Windows Server)
LAB_CLIENT_OS=win10      # the student machine OS

LAB_DOMAIN=lab.local
LAB_NETBIOS=LAB
LAB_DC_NAME=DC10
LAB_CLIENT_NAME=CL10

LAB_NET=10.77.110
LAB_PREFIX=24
LAB_LAN_PORT=47110

LAB_ADMIN_USER=labadmin
LAB_ADMIN_USER_PASSWORD='DomAdm!2026'
LAB_USER=student
LAB_USER_PASSWORD='Pupil!2026'

LAB_DC_MEM=3072
LAB_CLIENT_MEM=4096
