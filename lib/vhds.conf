# win-test-lab: the Microsoft "Test Drive" VHDs that serve a VHD-import OS (the `vhd:` rows of
# oslist.conf; see docs/ISOS.md). Microsoft's files cannot ship with this project (they are
# big, and Microsoft's terms do not allow redistributing them), so this only says how to
# RECOGNISE them and where to get them.
#
# Every copy of a download has the same unique ID in its VHD footer (the last 512 bytes of the
# .vhd), so a .vhd anywhere under the ISO folder with a listed ID is used for its OS whatever it
# is called. A .vhd whose path contains the OS's `vhd:` hint (oslist.conf) is used as well, e.g.
# another release of the same download.
#
# key  vhd_unique_id (32 hex digits)  download page (open it, accept Microsoft's terms, download all parts)  unpacked file
2003   60478ce359114ccab62b7064e8cab339   https://www.microsoft.com/en-us/download/details.aspx?id=19727   Win2k3R2EE.vhd
2008   a12e34a470c156439674678b6aa118ef   https://www.microsoft.com/en-us/download/details.aspx?id=2227    WS2008R2Fullx64Ent.vhd
