# win-test-lab OS table. Whitespace-separated; '#' starts a comment.
# display = rest of the line (may contain spaces).
# edition_id is matched against WIM EDITIONID exactly, then with an "Eval" suffix
# (evaluation media report e.g. ServerStandardEval).
# inst_type "Server" = Desktop Experience, "Server Core" = core.
# kind     "server" can be a domain controller; "client" joins the DC (Win10/11).
# firmware "bios" (i440fx/MBR) or "uefi" (q35/OVMF; Win11 needs it; arm64 is always uefi).
# arch     "x64" (qemu-system-x86_64) or "arm64" (qemu-system-aarch64, the `virt` machine). The
#          ISO must match it too: x64 and arm64 Windows 11 have the same build number.
#
# source   how the base image is made: "iso" installs from a Windows ISO (the default); "vhd:HINT"
#          imports a pre-installed .vhd whose path contains HINT (for Server 2003 / 2008 R2, which
#          have no usable free install ISO - Microsoft ships them as VHD Test Drive images; see
#          docs/ISOS.md). A vhd row's build/edition_id/fallback_index are unused (no WIM to read).
#          Options after the hint, joined with '+':
#            +enter   the image's first-boot setup shows a dialog no answer file can skip (Server
#                     2003's evaluation copy notice), so the build presses Enter until the guest reports.
#            +nousb   the guest hangs at the boot after its setup when QEMU gives it a USB controller
#                     (Server 2003), so its VMs get none: no usb-tablet, PS/2 keyboard and mouse.
#
# key          build  edition_id       inst_type  kind    firmware  arch   fallback_index  min_disk_gb  source           display
2003           3790   -                Server     server  bios      x64    1   40  vhd:Win2k3+enter+nousb Windows Server 2003 R2
2008           7601   -                Server     server  bios      x64    1   40  vhd:WS2008R2     Windows Server 2008 R2
2012           9600   ServerStandard   Server     server  bios      x64    2   60  iso              Windows Server 2012 R2
2016           14393  ServerStandard   Server     server  bios      x64    2   60  iso              Windows Server 2016
2019           17763  ServerStandard   Server     server  bios      x64    2   60  iso              Windows Server 2019
2022           20348  ServerStandard   Server     server  bios      x64    2   60  iso              Windows Server 2022
2025           26100  ServerStandard   Server     server  bios      x64    2   80  iso              Windows Server 2025
win10          19041  Professional     Client     client  bios      x64    6   40  iso              Windows 10 Pro 22H2
win11          26300  Professional     Client     client  uefi      x64    6   40  iso              Windows 11 Pro 24H2
