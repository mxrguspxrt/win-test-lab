# win-test-lab OS table. Whitespace-separated; '#' starts a comment.
# display = rest of the line (may contain spaces).
# edition_id is matched against WIM EDITIONID exactly, then with an "Eval" suffix
# (evaluation media report e.g. ServerStandardEval).
# inst_type "Server" = Desktop Experience, "Server Core" = core.
# kind     "server" can be a domain controller; "client" joins the DC (Win10/11).
# firmware "bios" (i440fx/MBR) or "uefi" (q35/OVMF; Win11 needs it; arm64 is always uefi).
# arch     "x64" (qemu-system-x86_64) or "arm64" (qemu-system-aarch64, the `virt` machine). The
#          ISO must match it too: x64 and arm64 Windows 11 have the same build number.
#
# key          build  edition_id       inst_type  kind    firmware  arch   fallback_index  min_disk_gb  display
2012           9600   ServerStandard   Server     server  bios      x64    2   60  Windows Server 2012 R2
2016           14393  ServerStandard   Server     server  bios      x64    2   60  Windows Server 2016
2019           17763  ServerStandard   Server     server  bios      x64    2   60  Windows Server 2019
2022           20348  ServerStandard   Server     server  bios      x64    2   60  Windows Server 2022
2025           26100  ServerStandard   Server     server  bios      x64    2   80  Windows Server 2025
win10          19041  Professional     Client     client  bios      x64    6   40  Windows 10 Pro 22H2
win11          26300  Professional     Client     client  uefi      x64    6   40  Windows 11 Pro 24H2
win11-arm64    26300  Professional     Client     client  uefi      arm64  3   60  Windows 11 Pro on Arm
