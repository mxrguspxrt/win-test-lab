# win-test-lab run config: boot the 2019 lab, mount the smoke-test example as X:,
# install it as Administrator, then run it as LAB\student.
#   lab run examples/configs/2019-smoke.conf
version = 2019
mount   = ../smoke-test/out:X
run_as_admin   = X:\setup.bat
run_as_student = X:\smoke.exe
name    = smoke
