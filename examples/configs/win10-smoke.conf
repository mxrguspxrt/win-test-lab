# Boot the win10 lab (Server 2019 DC + Windows 10 Pro client), mount the smoke-test example
# as X:, install it as admin (SYSTEM), then run it as LAB\student.
#   lab run examples/configs/win10-smoke.conf
version = win10
mount   = ../smoke-test/out:X
run_as_admin   = X:\setup.bat
run_as_student = X:\smoke.exe
name    = win10-smoke
