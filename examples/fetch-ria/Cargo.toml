[package]
name = "fetch-ria"
version = "0.1.0"
edition = "2021"
# no dependencies on purpose: HTTPS goes through Windows' own WinHTTP (the same TLS
# stack your users' Windows has), and an old toolchain (see build.sh) builds it fine.

[dependencies]

[profile.release]
opt-level = "s"
strip = true
panic = "abort"
