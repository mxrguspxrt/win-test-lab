# images-list.conf - the image catalog: friendly KEY = ISO filename.
#
# A lab's `version` (labs/<version>.conf, or `version=` in a run config) is looked up here first
# to find its installer ISO. The ISO path is relative to WTL_ISO_DIR (win-test-lab/iso-files by
# default) unless absolute. The build number is still verified by reading the ISO.
#
# Short keys pick a sensible default; add specific keys when you keep several variants
# (language / arch / build), e.g. win11_en_x64 vs win11_de_arm64.
#
#   KEY = file.iso
# Lines are `key = value`; '#' starts a comment. A key may appear once.

# --- Windows Server (can be a domain controller) ---
2012     = win2012r2_en_x64_9600.iso
2012r2   = win2012r2_en_x64_9600.iso
2016     = win2016_en_x64_14393.iso
2019     = win2019_en_x64_17763.iso
2022     = win2022_en_x64_20348.iso
2025     = win2025_en_x64_26100.iso

# --- Windows client (joins the Server DC; cannot BE the DC) ---
win10        = win10_22h2_en_x64_19041.iso
win10_en_x64 = win10_22h2_en_x64_19041.iso
win11        = win11_24h2_en_x64_26300.iso
win11_en_x64 = win11_24h2_en_x64_26300.iso

# Examples of variant keys you would add when you have more ISOs:
#   win11_de_x64   = win11_24h2_de_x64_26300.iso
#   win11_en_arm64 = win11_24h2_en_arm64_26300.iso
