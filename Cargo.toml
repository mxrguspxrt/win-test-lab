[package]
name = "win-test-lab"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "Test Windows software on real Windows in QEMU: unattended installs, Active Directory labs, a frozen 0 state, one command per run"
license = "MIT"
repository = "https://github.com/mxrguspxrt/win-test-lab"
homepage = "https://github.com/mxrguspxrt/win-test-lab"
readme = "README.md"
keywords = ["windows", "testing", "qemu", "active-directory", "virtual-machine"]
categories = ["development-tools::testing", "command-line-utilities", "virtualization"]
build = "embed.rs"
# what `cargo package` ships: the program, the files compiled into it (guest scripts, the OS
# table, the example labs), the schemas and the test suite. The older bash/Python tools,
# docs/ and examples/ stay in git only.
include = [
    "/src/**",
    "/embed.rs",
    "/tests/fake_lab.rs",
    "/guest/*.ps1",
    "/guest/*.tmpl",
    "/lib/oslist.conf",
    "/labs/*.json",
    "/schema/*.json",
    "/README.md",
    "/LICENSE",
]

# A few small, well-known crates for the generic parts (JSON, command line, errors,
# base64, local time, Ctrl-C, process calls, the per-user folders); the win-test-lab
# logic itself (ISO writer, QMP client, serial protocol, lab runner) is in-tree.
[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
# the per-user data and config folders (XDG on Linux, Application Support on macOS, AppData)
directories = "6"
# machines/users keep their JSON order (IP defaults .20/.21 follow declaration order)
indexmap = { version = "2", features = ["serde"] }
percent-encoding = "2"
# JSON Schema generated from the typed lab/run structs (schema/)
schemars = { version = "0.8", features = ["indexmap2", "preserve_order"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: objects keep insertion order, like Python dicts (outputs' summary)
serde_json = { version = "1", features = ["preserve_order"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[lib]
name = "wtl"
path = "src/lib.rs"

[[bin]]
name = "wtl"
path = "src/main.rs"

# tests/fake_lab.rs has its own main(): it is both the test driver and the fake
# qemu-system-x86_64 / qemu-img that `wtl` is pointed at.
[[test]]
name = "fake_lab"
harness = false
